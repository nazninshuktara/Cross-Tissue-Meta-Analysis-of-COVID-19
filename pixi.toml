[workspace]
channels = ["conda-forge", "bioconda"]
name = "Cross-Tissue-Meta-Analysis-of-COVID-19"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
# Core Languages
python = "3.11.*"
r-base = "4.5.*"

# SRA and FASTQ
sra-tools = ">=3.2,<4"
parallel-fastq-dump = "==0.6.7"

# Quality Check
fastqc = "==0.12.1"
multiqc = ">=1.33,<2"

# Transcript Quantification
salmon = ">=1.10,<2"

# Python Analysis
pandas = ">=3.0.6,<4"

# R Analysis
# Bioconductor packages
bioconductor-tximport = ">=1.38.2,<2"
bioconductor-deseq2 = ">=1.50.2,<2"
bioconductor-clusterprofiler = ">=4.18.4,<5"
bioconductor-enrichplot = ">=1.30.5,<2"
bioconductor-annotationdbi = ">=1.72.0,<2"
"bioconductor-org.hs.eg.db" = ">=3.22.0,<4"
bioconductor-complexheatmap = ">=2.26,<3"

# R tidyverse and data manupulation
r-readr = ">=2.2.0,<3"
r-dplyr = ">=1.2.1,<2"
r-tidyr = ">=1.3.2,<2"
r-tibble = ">=3.3.1,<4"
r-jsonlite = ">=2.0.0,<3"

# Statistical analysis
r-metafor = ">=5.0_1,<6"

# Visualization
r-ggplot2 = ">=4.0.3,<5"
r-rcolorbrewer = ">=1.1_3,<2"
r-pheatmap = ">=1.0.13,<2"
r-patchwork = "*"
r-stringr = "*"
r-ggridges = "*"
r-gridextra = "*"

# Reporting and manuscript tables
r-gt = ">=1.3.0,<2"
r-gtsummary = ">=2.6.1,<3"
r-flextable = ">=0.10.1,<0.11"
r-officer = ">=0.7.6,<0.8"
r-nlme = ">=3.1_170,<4"
r-litedown = ">=0.10,<0.11"
r-xfun = ">=0.61,<0.62"
r-stringi = ">=1.8.7,<2"
r-igraph = ">=2.3.3,<3"
r-gdtools = ">=0.5.1,<0.6"

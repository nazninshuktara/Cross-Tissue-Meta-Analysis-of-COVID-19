[workspace]
channels = ["conda-forge", "bioconda"]
name = "Cross-Tissue-Meta-Analysis-of-COVID-19"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
# Core Languages
python = "3.11.*"
r-base = "4.5.*"

# SRA and FASTQ
sra-tools = ">=3.2,<4"
parallel-fastq-dump = "==0.6.7"

# Quality Control
fastqc = "==0.12.1"
multiqc = ">=1.33,<2"

# Transcript Quantification
salmon = ">=1.10,<2"
pandas = ">=3.0.6,<4"

